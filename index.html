  .noise{ position:fixed; inset:0; pointer-events:none; z-index:50;
    background: repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px);
    opacity: calc(var(--corruption) * 0.5); transition: opacity 1s ease; mix-blend-mode: overlay; }
  .scan{ position:fixed; inset:0; pointer-events:none; z-index:51;
    background: linear-gradient(180deg, transparent 0%, rgba(151,223,252,0.06) 50%, transparent 100%);
    height:140px; animation: scan 5s linear infinite; opacity: calc(var(--corruption) * 0.9 + 0.1); }
  @keyframes scan{ 0%{transform:translateY(-140px)} 100%{transform:translateY(100vh)} }

  header{ position:relative; z-index:10; display:flex; align-items:center; justify-content:space-between;
    gap:12px; flex-wrap:wrap; padding:14px 22px; border-bottom:1px solid var(--panel-edge); background: rgba(26,61,102,0.92); }
  .wc-logo{ font-family:'JetBrains Mono',monospace; font-weight:700; color:var(--celeste); font-size:14px; display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
  .role-badge{ font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; letter-spacing:0.08em;
    padding:4px 10px; border-radius:5px; }
  .role-badge.h1{ background:rgba(151,223,252,0.15); color:var(--celeste); border:1px solid var(--celeste); }
  .role-badge.h2{ background:rgba(255,157,28,0.18); color:var(--naranja); border:1px solid var(--naranja); }
  .room-badge{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--muted); border:1px dashed var(--panel-edge); padding:3px 8px; border-radius:5px; }
  .status-right{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .timer{ font-family:'JetBrains Mono', monospace; font-size:14px; color:var(--amarillo);
    border:1px solid var(--panel-edge); padding:4px 10px; border-radius:4px; transition: color .3s ease, border-color .3s ease; position:relative; }
  .timer.low{ color:var(--naranja); border-color:var(--naranja); animation: pulse 1.4s infinite; }
  .timer.done{ color:var(--naranja); }
  .penalty-pop{ position:absolute; right:0; top:110%; font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:700;
    color:var(--naranja); opacity:0; pointer-events:none; }
  .penalty-pop.show{ animation: penaltyFloat 1.4s ease forwards; }
  @keyframes penaltyFloat{ 0%{opacity:0; transform:translateY(-4px)} 15%{opacity:1} 100%{opacity:0; transform:translateY(16px)} }
  .dots{ display:flex; gap:5px; flex-wrap:wrap; max-width:180px; }
  .dot{ width:9px; height:9px; border-radius:50%; border:1px solid var(--panel-edge); background:transparent; transition: all .4s ease; }
  .dot.done{ background:var(--celeste); border-color:var(--celeste); box-shadow:0 0 8px var(--celeste); }
  .dot.active{ border-color:var(--naranja); animation: pulse 1.4s infinite; }
  @keyframes pulse{ 0%,100%{box-shadow:0 0 0 rgba(255,157,28,0.5)} 50%{box-shadow:0 0 10px rgba(255,157,28,0.8)} }
  .code-strip{ display:flex; gap:4px; font-family:'JetBrains Mono',monospace; flex-wrap:wrap; max-width:240px; }
  .code-box{ width:20px; height:26px; border:1px solid var(--panel-edge); display:flex; align-items:center; justify-content:center;
    font-weight:700; color:var(--celeste); border-radius:4px; background: var(--azul); font-size:12px; }
  .conn-dot{ width:9px; height:9px; border-radius:50%; background:#666; display:inline-block; margin-right:5px; transition:background .3s ease; }
  .conn-dot.live{ background:#4ADE80; box-shadow:0 0 6px #4ADE80; }

  main{ flex:1; display:flex; align-items:flex-start; justify-content:center; padding:22px 16px 40px; position:relative; z-index:5; }
  .window{ width:100%; max-width:820px; background: var(--azul); border:1px solid var(--panel-edge); border-radius:10px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45); overflow:hidden; animation: rise .5s ease; }
  @keyframes rise{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
  .window.glitch{ animation: glitchShake .35s ease; }
  @keyframes glitchShake{ 0%,100%{transform:translate(0,0)} 20%{transform:translate(-5px,2px)} 40%{transform:translate(5px,-2px)} 60%{transform:translate(-3px,-2px)} 80%{transform:translate(3px,2px)} }
  .titlebar{ display:flex; align-items:center; gap:8px; padding:10px 14px; background: var(--navy);
    border-bottom:1px solid var(--panel-edge); font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--muted); }
  .tdot{ width:9px; height:9px; border-radius:50%; }
  .tdot:nth-child(1){ background: var(--naranja); } .tdot:nth-child(2){ background: var(--amarillo); } .tdot:nth-child(3){ background: var(--celeste); }
  .body-pad{ padding:28px 26px 26px; max-height:84vh; overflow-y:auto; }

  .eyebrow{ font-family:'JetBrains Mono', monospace; font-size:12px; color:var(--naranja); letter-spacing:0.08em; margin-bottom:8px; }
  h1{ font-family:'Space Grotesk', sans-serif; font-size:25px; font-weight:700; margin-bottom:18px; line-height:1.3; color:var(--celeste); }
  h2{ font-family:'Space Grotesk', sans-serif; font-size:20px; font-weight:700; margin-bottom:16px; color:var(--celeste); }
  p{ line-height:1.68; color:#DCEFFB; margin-bottom:16px; font-size:15px; }
  .muted{ color:var(--muted); font-size:13px; }

  .hacker-line{ font-family:'JetBrains Mono',monospace; font-size:12.5px; color:var(--naranja);
    background:rgba(255,157,28,0.08); border-left:2px solid var(--naranja); padding:10px 14px; border-radius:0 6px 6px 0;
    margin:0 0 18px; line-height:1.55; }
  .hacker-line b{ color:var(--amarillo); }
  .sync-note{ font-size:12.5px; color:var(--amarillo); margin-bottom:18px; border-left:2px solid var(--amarillo); padding:2px 0 2px 12px; line-height:1.5; }
  .waiting-note{ font-size:13.5px; color:var(--muted); margin-top:20px; border:1px dashed var(--panel-edge); border-radius:8px; padding:14px 16px; line-height:1.55; }

  .btn{ font-family:'Space Grotesk', sans-serif; font-weight:700; font-size:15px; background: var(--naranja); color:#1A3D66;
    border:none; padding:12px 22px; border-radius:6px; cursor:pointer; transition: transform .15s ease, box-shadow .15s ease; }
  .btn:hover{ transform:translateY(-1px); box-shadow:0 6px 18px rgba(255,157,28,0.35); }
  .btn.small{ padding:8px 14px; font-size:13px; }
  .btn.ghost{ background:transparent; color:var(--celeste); border:1px solid var(--panel-edge); }

  .role-tag{ display:inline-block; font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:0.06em;
    padding:5px 10px; border-radius:4px; margin-bottom:16px; }
  .role-tag.p1{ background:rgba(151,223,252,0.15); color:var(--celeste); }
  .role-tag.p2{ background:rgba(255,157,28,0.18); color:var(--naranja); }

  .cipher-wrap{ overflow-x:auto; padding:10px 0; }
  .cipher-row{ display:flex; gap:4px; font-family:'JetBrains Mono',monospace; }
  .cipher-cell{ min-width:24px; text-align:center; padding:4px 0; font-size:12px; border-bottom:2px solid var(--panel-edge); }
  .cipher-row.top .cipher-cell{ color:var(--muted); }
  .cipher-row.bottom .cipher-cell{ color:var(--celeste); font-weight:700; }
  .ciphertext{ font-family:'JetBrains Mono',monospace; font-size:23px; letter-spacing:0.12em; color:var(--amarillo);
    background:var(--navy); border:1px dashed var(--panel-edge); padding:12px 16px; border-radius:6px; display:inline-block; margin:6px 0 10px; }

  .grid20{ display:grid; grid-template-columns: repeat(5,50px); gap:7px; margin:12px 0; }
  .grid20 div{ width:50px; height:50px; display:flex; align-items:center; justify-content:center; font-size:22px;
    font-family:'JetBrains Mono',monospace; font-weight:700; background:var(--navy); border:1px solid var(--panel-edge); border-radius:8px; color:var(--celeste); }
  .coord-grid{ display:grid; grid-template-columns: 34px repeat(5,50px); gap:7px; margin:12px 0; }
  .coord-grid div{ height:38px; display:flex; align-items:center; justify-content:center; font-size:15px;
    font-family:'JetBrains Mono',monospace; font-weight:700; border-radius:8px; }
  .coord-grid .hdr{ color:var(--amarillo); }
  .coord-grid .cell{ background:var(--navy); border:1px dashed var(--panel-edge); color:var(--muted); font-size:12px; }
  .coord-grid .blank{ background:transparent; }

  pre.code{ font-family:'JetBrains Mono',monospace; font-size:13.5px; line-height:1.7; background:var(--navy);
    border:1px solid var(--panel-edge); border-radius:8px; padding:14px 16px; color:#DCEFFB; margin:10px 0; overflow-x:auto; }
  pre.code .kw{ color: var(--naranja); } pre.code .num{ color: var(--amarillo); }

  .datacard{ font-family:'JetBrains Mono',monospace; font-size:20px; font-weight:700; background:var(--navy);
    border:1px dashed var(--panel-edge); color:var(--amarillo); padding:12px 16px; border-radius:6px; display:inline-block; margin:6px 0; }

  .answer-row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:16px; }
  input[type=text]{ font-family:'JetBrains Mono',monospace; font-size:16px; background:var(--navy); border:1px solid var(--panel-edge);
    color:var(--celeste); padding:11px 14px; border-radius:6px; width:170px; outline:none; }
  input[type=text]:focus{ border-color:var(--celeste); }

  .feedback{ margin-top:12px; font-family:'JetBrains Mono',monospace; font-size:13.5px; min-height:20px; }
  .feedback.err{ color:var(--naranja); } .feedback.ok{ color:var(--celeste); }
  .shake{ animation: shake .4s; } @keyframes shake{ 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  .hint-toggle{ background:none; border:none; color:var(--muted); font-size:12.5px; text-decoration:underline; cursor:pointer;
    padding:0; margin-top:10px; font-family:'Inter',sans-serif; }
  .hint-text{ font-size:13px; color:var(--amarillo); margin-top:8px; display:none; } .hint-text.show{ display:block; }

  .chip-row{ display:flex; gap:8px; flex-wrap:wrap; margin:14px 0; }
  .chip-btn{ font-family:'JetBrains Mono',monospace; font-size:12.5px; background:var(--navy); border:1px solid var(--panel-edge);
    color:var(--celeste); padding:9px 12px; border-radius:6px; cursor:pointer; transition:all .15s ease; }
  .chip-btn:hover{ border-color:var(--celeste); }
  .chip-btn.used{ opacity:0.35; pointer-events:none; }
  .slot-row{ display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  .slot{ min-width:100px; height:38px; border:1px dashed var(--panel-edge); border-radius:6px; display:flex; align-items:center;
    justify-content:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); padding:0 8px; text-align:center; }
  .slot.filled{ border-style:solid; color:var(--celeste); background:var(--navy); }

  .morse-light{ width:70px; height:70px; border-radius:50%; background:var(--navy); border:2px solid var(--panel-edge);
    margin:14px auto; transition: background .08s ease, box-shadow .08s ease; }
  .morse-light.on{ background:var(--amarillo); box-shadow:0 0 30px rgba(253,202,64,0.7); }

  .color-light{ width:110px; height:110px; border-radius:50%; background:var(--navy); border:3px solid var(--panel-edge);
    margin:16px auto; transition: background .12s ease, box-shadow .12s ease, transform .12s ease; }
  .color-light.c-celeste{ background:var(--celeste); box-shadow:0 0 44px rgba(151,223,252,0.85); transform:scale(1.06); }
  .color-light.c-amarillo{ background:var(--amarillo); box-shadow:0 0 44px rgba(253,202,64,0.85); transform:scale(1.06); }
  .color-light.c-naranja{ background:var(--naranja); box-shadow:0 0 44px rgba(255,157,28,0.85); transform:scale(1.06); }
  .seq-counter{ text-align:center; font-family:'JetBrains Mono',monospace; font-size:13px; color:var(--muted); min-height:18px; margin-bottom:8px; }
  .color-btns{ display:flex; gap:14px; justify-content:center; margin:16px 0; flex-wrap:wrap; }
  .color-tap{ width:82px; height:82px; border-radius:14px; border:2px solid rgba(0,0,0,0.25); cursor:pointer;
    transition: transform .1s ease, box-shadow .1s ease; font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700;
    color:#1A3D66; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px; }
  .color-tap:active{ transform:scale(0.93); }
  .color-tap.t-celeste{ background:var(--celeste); } .color-tap.t-amarillo{ background:var(--amarillo); } .color-tap.t-naranja{ background:var(--naranja); }
  .seq-slots{ display:flex; gap:7px; justify-content:center; margin:10px 0; flex-wrap:wrap; }
  .seq-slot{ width:34px; height:34px; border-radius:8px; border:1px dashed var(--panel-edge); background:transparent;
    display:flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--muted); }
  .seq-slot.f-celeste{ background:var(--celeste); border-style:solid; }
  .seq-slot.f-amarillo{ background:var(--amarillo); border-style:solid; }
  .seq-slot.f-naranja{ background:var(--naranja); border-style:solid; }

  .wire-row{ display:flex; gap:6px; flex-wrap:wrap; margin:12px 0; }
  .wire{ width:34px; height:10px; border-radius:4px; }

  .pixel-grid{ display:grid; grid-template-columns: repeat(8,30px); gap:3px; margin:12px 0; }
  .pixel{ width:30px; height:30px; border-radius:3px; }

  .final-lock{ text-align:center; }
  .lock-stage{ margin:10px auto 4px; width:130px; height:140px; position:relative;
    transition: transform .6s cubic-bezier(.34,1.56,.64,1); }
  .lock-stage.lock-open{ transform: scale(1.22); }
  #shackleClosed{ opacity:1; transition: opacity .25s ease; }
  .lock-open #shackleClosed{ opacity:0; }
  #shackleOpen{ opacity:0; transform-origin: 92px 62px; transform: scale(0.6) rotate(-14deg);
    transition: opacity .35s ease .3s, transform .55s cubic-bezier(.34,1.56,.64,1) .3s; }
  .lock-open #shackleOpen{ opacity:1; transform: scale(1) rotate(0deg); }
  #lockBody{ transition: transform .6s cubic-bezier(.34,1.56,.64,1) .1s, filter .8s ease; transform-origin: center; }
  .lock-open #lockBody{ transform: translateY(2px); }
  #confettiCanvas{ position:fixed; inset:0; pointer-events:none; z-index:60; display:none; }
  .master-code{ font-family:'JetBrains Mono',monospace; font-size:30px; letter-spacing:0.14em; color:var(--celeste);
    text-shadow:0 0 20px rgba(151,223,252,0.5); margin:14px 0; word-break:break-all; }
  .final-msg{ display:none; }
  .final-msg.show{ display:block; animation: rise .6s ease; }
  footer{ text-align:center; padding:12px; font-size:12px; color:var(--panel-edge); font-family:'JetBrains Mono',monospace; position:relative; z-index:5; background:rgba(26,61,102,0.85); }

  @media (max-width:520px){
    .body-pad{ padding:20px 16px 20px; }
    h1{ font-size:21px; }
    .grid20{ grid-template-columns:repeat(5,44px); } .grid20 div{ width:44px; height:44px; font-size:18px; }
    .coord-grid{ grid-template-columns: 28px repeat(5,44px); }
    .pixel-grid{ grid-template-columns:repeat(8,26px); } .pixel{ width:26px; height:26px; }
    .color-tap{ width:70px; height:70px; }
    .master-code{ font-size:22px; }
  }
  @media (prefers-reduced-motion: reduce){
    .scan{ animation:none; }
  }
</style>
</head>

/* ============ AUDIO ============ */
let audioCtx = null;
let soundMuted = false;
function toggleMute(){
  soundMuted = !soundMuted;
  document.getElementById('muteBtn').textContent = soundMuted ? '🔇' : '🔊';
}
function beep(freq, durMs, delayMs=0, vol=0.16){
  if(soundMuted) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audioCtx.currentTime + delayMs/1000;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + durMs/1000);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t0); osc.stop(t0 + durMs/1000 + 0.05);
  }catch(e){ /* sin audio, no pasa nada */ }
}
function sfxOk(){ beep(660,120); beep(880,160,130); }
function sfxErr(){ beep(180,220,0,0.12); }

function onRoomUpdate(snap){
  const val = snap.val() || {};
  remoteState = {
    missionStarted: !!val.missionStarted,
    endsAt: val.endsAt || null,
    solved: val.solved || [],
    current: val.current || 0,
    penalty: val.penalty || null,
    lockOpened: !!val.lockOpened
  };
  solvedDigits = remoteState.solved.slice();
  ensureTimer();
  renderTopBar();
  checkPenaltyBroadcast();
  checkLockBroadcast();
  const target = remoteState.missionStarted ? remoteState.current : 0;
  if(target !== renderedStage){
    const isAdvance = target === renderedStage + 1 && renderedStage >= 1;
    if(isAdvance){
      setTimeout(()=>{ renderedStage = target; goToStage(target); }, 700);
    } else {
      renderedStage = target;
      goToStage(target);
    }
  }
}
function startMission(){
  db.ref('rooms/'+roomId).transaction(cur=>{
    cur = cur || {};
    if(!cur.missionStarted){
      cur.missionStarted = true;
      cur.endsAt = Date.now() + TIME_LIMIT*1000;
      cur.current = 1;
      cur.solved = [];
    }
    return cur;
  });
}

/* ============ TIMER (derivado de endsAt compartido) ============ */
function renderTime(){
  const m = String(Math.floor(remaining/60)).padStart(2,'0');
  const s = String(remaining%60).padStart(2,'0');
  const el = document.getElementById('timer');
  el.firstChild.textContent = m+':'+s;
  el.classList.toggle('low', remaining <= 300 && remaining > 0);
  el.classList.toggle('done', remaining <= 0);
}
function ensureTimer(){
  if(!remoteState.missionStarted || !remoteState.endsAt) return;
  remaining = Math.max(0, Math.round((remoteState.endsAt - Date.now())/1000));
  renderTime();
  if(timerHandle) return;
  timerHandle = setInterval(()=>{
    if(!remoteState.endsAt) return;
    remaining = Math.max(0, Math.round((remoteState.endsAt - Date.now())/1000));
    renderTime();
    if(remaining<=0){ clearInterval(timerHandle); timerHandle=null; }
  }, 1000);
}

function submitTimeCost(seconds, kind){
  const t = Date.now();
  localShownPenalties[t] = true;
  playPenaltyFX(seconds, kind);
  db.ref('rooms/'+roomId).transaction(cur=>{
    cur = cur || {};
    cur.endsAt = (cur.endsAt || (Date.now()+TIME_LIMIT*1000)) - seconds*1000;
    cur.penalty = { t: t, s: seconds, k: kind };
    return cur;
  });
}
function submitPenalty(){ submitTimeCost(PENALTY, 'penalty'); }
function checkPenaltyBroadcast(){
  if(remoteState.penalty && remoteState.penalty.t && !localShownPenalties[remoteState.penalty.t]){
    localShownPenalties[remoteState.penalty.t] = true;
    playPenaltyFX(remoteState.penalty.s || PENALTY, remoteState.penalty.k || 'penalty');
  }
}
function playPenaltyFX(seconds, kind){
  const pop = document.getElementById('penaltyPop');
  if(pop){
    pop.textContent = '−0:'+String(seconds).padStart(2,'0');
    pop.classList.remove('show'); void pop.offsetWidth; pop.classList.add('show');
  }
  if(kind === 'hint'){
    beep(340, 160);
  } else {
    const win = document.getElementById('mainWindow');
    if(win){ win.classList.remove('glitch'); void win.offsetWidth; win.classList.add('glitch'); }
    sfxErr();
  }
}

/* ============ CONFETI ============ */
function triggerConfetti(){
  const canvas = document.getElementById('confettiCanvas');
  if(!canvas) return;
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  canvas.style.display = 'block';
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx){ canvas.style.display = 'none'; return; }
  const colors = ['#97DFFC','#FDCA40','#FF9D1C'];
  const particles = [];
  for(let k=0;k<90;k++){
    particles.push({
      x: Math.random()*canvas.width,
      y: -20 - Math.random()*canvas.height*0.4,
      vy: 2.5 + Math.random()*3,
      vx: (Math.random()-0.5)*2,
      size: 5 + Math.random()*6,
      color: colors[Math.floor(Math.random()*colors.length)],
      rot: Math.random()*Math.PI,
      vr: (Math.random()-0.5)*0.25
    });
  }
  const start = Date.now();
  function frame(){
    const elapsed = Date.now() - start;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6);
      ctx.restore();
    });
    if(elapsed < 3200){
      requestAnimationFrame(frame);
    } else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.style.display = 'none';
    }
  }
  frame();
}

/* ============ CERTIFICADO DESCARGABLE ============ */
function downloadCertificate(){
  const canvas = document.createElement('canvas');
  canvas.width = 900; canvas.height = 560;
  const ctx = canvas.getContext && canvas.getContext('2d');
  if(!ctx){ alert('No se pudo generar el certificado en este navegador.'); return; }
  const grad = ctx.createLinearGradient(0,0,0,canvas.height);
  grad.addColorStop(0, '#1A3D66');
  grad.addColorStop(1, '#255FA1');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle = 'rgba(151,223,252,0.5)';
  ctx.lineWidth = 6;
  ctx.strokeRect(20,20,canvas.width-40,canvas.height-40);

  function drawTextAndDownload(){
    ctx.textAlign = 'center';
    ctx.fillStyle = '#FF9D1C';
    ctx.font = '700 20px monospace';
    ctx.fillText('CERTIFICADO DE RECUPERACIÓN DIGITAL', canvas.width/2, 150);

    ctx.fillStyle = '#97DFFC';
    ctx.font = '700 42px sans-serif';
    ctx.fillText('¡MISIÓN CUMPLIDA!', canvas.width/2, 205);

    ctx.font = '500 20px sans-serif';
    ctx.fillStyle = '#DCEFFB';
    ctx.fillText('Equipo: ' + (roomId ? roomId.toUpperCase() : 'EQUIPO'), canvas.width/2, 250);

    ctx.font = '700 20px monospace';
    ctx.fillStyle = '#FDCA40';
    ctx.fillText('Clave maestra reconstruida:', canvas.width/2, 320);
    ctx.font = '700 48px monospace';
    ctx.fillStyle = '#97DFFC';
    ctx.fillText(MASTER_CODE, canvas.width/2, 380);

    ctx.font = '500 18px monospace';
    ctx.fillStyle = '#DCEFFB';
    const timerEl = document.getElementById('timer');
    const t = timerEl && timerEl.firstChild ? timerEl.firstChild.textContent : '';
    ctx.fillText('Tiempo restante: ' + t, canvas.width/2, 430);

    ctx.font = '400 13px monospace';
    ctx.fillStyle = 'rgba(151,223,252,0.7)';
    ctx.fillText('equipo_recuperacion_digital // wecode_academia', canvas.width/2, 505);

    const link = document.createElement('a');
    link.download = 'certificado-'+(roomId||'equipo')+'.png';
    link.href = canvas.toDataURL('image/png');
    link.click();
  }

  const logoEl = document.querySelector('.wc-logo img');
  if(logoEl && logoEl.src){
    const img = new Image();
    img.onload = function(){ ctx.drawImage(img, canvas.width/2 - 70, 55, 140, 46); drawTextAndDownload(); };
    img.onerror = drawTextAndDownload;
    img.src = logoEl.src;
  } else {
    drawTextAndDownload();
  }
}

/* ============ MORSE (Hacker 2) ============ */
const MORSE = {O:['dash','dash','dash'], C:['dash','dot','dash','dot'], H:['dot','dot','dot','dot']};
function playMorse(slow){
  morseTimeouts.forEach(t=>clearTimeout(t));
  morseTimeouts = [];
  const word = ['O','C','H','O'];
  const light = document.getElementById('morseLight');
  if(!light) return;
  light.classList.remove('on');
  const f = slow || 1;
  let t = 400;
  word.forEach((letter)=>{
    MORSE[letter].forEach(sym=>{
      const dur = (sym==='dot' ? 200 : 560) * f;
      morseTimeouts.push(setTimeout(()=>{ light.classList.add('on'); beep(700, dur); }, t));
      morseTimeouts.push(setTimeout(()=> light.classList.remove('on'), t+dur));
      t += dur + 220*f;
    });
    t += 650*f;
  });
}

function playColors(){

  if(!light) return;
  light.className = 'color-light';
  const ON = 850, OFF = 420;

  COLOR_SEQ.forEach((c, idx)=>{

      light.className = 'color-light c-'+c;

      beep(COLOR_FREQ[c], ON*0.8);
    }, t));
    colorTimeouts.push(setTimeout(()=>{ light.className = 'color-light'; }, t+ON));
    t += ON + OFF;
  });
  colorTimeouts.push(setTimeout(()=>{
    counter.textContent = 'Fin de la transmisión. Pueden repetirla.';
  }, t));
}

    if(seqAttempt[k]) html += '<div class="slot filled">'+ORD_STEPS[seqAttempt[k]]+'</div>';
    else html += '<div class="slot">paso '+(k+1)+'</div>';
  }
  row.innerHTML = html;
}
function chipClick(i, key){
  if(seqAttempt.length >= ORD_TARGET.length) return;
  seqAttempt.push(key);
  document.getElementById('chip-'+key+'-'+i).classList.add('used');
  renderSlots(i);
  if(seqAttempt.length === ORD_TARGET.length){
    const match = ORD_TARGET.every((c,idx)=> c===seqAttempt[idx]);
    const fb = document.getElementById('seq-feedback-'+i);
    if(match){
      fb.className='feedback ok'; fb.textContent='✔ Programa reordenado. Sincronizando…';
      sfxOk();
      submitFragment(i, stages[i].digit);
    } else {
      fb.className='feedback err shake'; fb.textContent='✖ Ese orden no hace parpadear el LED (−15s). Inténtenlo de nuevo.';
      submitPenalty();
      setTimeout(()=> resetOrdenar(i), 900);
    }
  }
}
function resetOrdenar(i){
  seqAttempt = [];
  Object.keys(ORD_STEPS).forEach(k=>{
    const el = document.getElementById('chip-'+k+'-'+i);
    if(el) el.classList.remove('used');
  });
  renderSlots(i);
  const fb = document.getElementById('seq-feedback-'+i);
  if(fb && !fb.classList.contains('ok')){ fb.textContent=''; fb.className='feedback'; }
}

/* ============ SPRITE MAKECODE (Hacker 1) ============ */
function buildPixelGrid(){
  // 8x5 = 40 px · amarillos: 7 · celestes: 2 · clave = 7 - 2 = 5
  const pattern = [
    'naranja','naranja','amarillo','naranja','naranja','amarillo','naranja','naranja',
    'naranja','celeste','naranja','amarillo','amarillo','naranja','naranja','naranja',
    'naranja','naranja','naranja','naranja','naranja','naranja','celeste','naranja',
    'naranja','amarillo','naranja','naranja','naranja','amarillo','naranja','naranja',
    'naranja','naranja','naranja','amarillo','naranja','naranja','naranja','naranja'
  ];
  return '<div class="pixel-grid">'+pattern.map(c=>'<div class="pixel" style="background:var(--'+c+')"></div>').join('')+'</div>';
}
